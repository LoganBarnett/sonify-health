# Star Trek bridge preset, Windows edition.  Identical sound to
# connectivity-and-cpu-star-trek.toml; only the probe commands differ,
# using Windows PowerShell 5.1 cmdlets (Get-NetRoute, Test-Connection,
# Get-CimInstance) rather than POSIX sh.  On a stock Windows host the
# daemon runs each command through powershell.exe; from Git Bash, MSYS2,
# or Cygwin it uses sh instead, so run the POSIX preset there.
[[heartbeats]]
command = '''$gw = (Get-NetRoute -DestinationPrefix '0.0.0.0/0' -ErrorAction SilentlyContinue | Sort-Object RouteMetric | Select-Object -First 1 -ExpandProperty NextHop); if ($gw -and (Test-Connection -ComputerName $gw -Count 1 -Quiet)) { exit 0 } else { exit 1 }'''
crossfade_ms = 6.0
cycle_offset_secs = 0.0
cycle_secs = 15.0
name = "gateway"
phrase_gap = 0.0
playback = "clock"
poll_interval_secs = 10.0
repeat_rate = 1.0
result_mode = "exit-code"

[[heartbeats.notes]]
offset = 0.0
volume = 1.0

[heartbeats.notes.transition]
type = "discrete"

[[heartbeats.notes.transition.states]]
patch = "star-trek-ok"
threshold = 0.5

[[heartbeats.notes.transition.states]]
patch = "star-trek-error"
threshold = 1.01

[[heartbeats.notes]]
offset = 0.2
volume = 1.0

[heartbeats.notes.transition]
type = "discrete"

[[heartbeats.notes.transition.states]]
patch = "star-trek-ok"
threshold = 0.5

[[heartbeats.notes.transition.states]]
patch = "star-trek-error"
threshold = 1.01

[[heartbeats]]
# OpenDNS resolver.
command = "if (Test-Connection -ComputerName 208.67.222.222 -Count 1 -Quiet) { exit 0 } else { exit 1 }"
crossfade_ms = 6.0
cycle_offset_secs = 0.6
cycle_secs = 15.0
name = "internet"
phrase_gap = 0.0
playback = "clock"
poll_interval_secs = 10.0
repeat_rate = 1.0
result_mode = "exit-code"

[[heartbeats.notes]]
offset = 0.0
volume = 1.0

[heartbeats.notes.transition]
type = "discrete"

[[heartbeats.notes.transition.states]]
patch = "star-trek-ok"
threshold = 0.5

[[heartbeats.notes.transition.states]]
patch = "star-trek-error"
threshold = 1.01

[[heartbeats.notes]]
offset = 0.2
volume = 1.0

[heartbeats.notes.transition]
type = "discrete"

[[heartbeats.notes.transition.states]]
patch = "star-trek-ok"
threshold = 0.5

[[heartbeats.notes.transition.states]]
patch = "star-trek-error"
threshold = 1.1

[[heartbeats]]
command = "$v = (Get-CimInstance -ClassName Win32_Processor | Measure-Object -Property LoadPercentage -Average).Average / 100; [math]::Round([math]::Max(0.0, [math]::Min(1.0, $v)), 3).ToString([System.Globalization.CultureInfo]::InvariantCulture)"
crossfade_ms = 42.0
cycle_offset_secs = 4.8
cycle_secs = 15.0
name = "cpu"
phrase_gap = 0.0
playback = "loop"
poll_interval_secs = 5.0
repeat_rate = 1.0
result_mode = "stdout"

[[heartbeats.notes]]
offset = 0.0
volume = 1.0

[heartbeats.notes.transition]
patches = [
    "warpdrive-cpu-lo",
    "warpdrive-cpu-hi",
]
type = "gradient"

[[heartbeats.notes.transition.segments]]
intensity = 5.3
strategy = "linear"
[patches.star-trek-error]
amplitude = 0.54
chirp_ratio = 0.8
overrides = "star-trek-ok"

[patches.star-trek-ok]
