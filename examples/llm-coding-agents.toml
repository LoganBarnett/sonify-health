[[heartbeats]]
command = """
cat ~/.claude/sessions/*.json 2>/dev/null |
  jq --slurp 'map(select(.status == "busy")) | length / 8'
"""
crossfade_ms = 6.0
cycle_offset_secs = 0.0
cycle_secs = 15.0
name = "agents-busy"
phrase_gap = 0.0
playback = "continuous"
poll_interval_secs = 2.0
repeat_rate = 1.0
result_mode = "stdout"
tiers = []

[[heartbeats.notes]]
offset = 0.0
volume = 1.0

[heartbeats.notes.transition]
patches = [
    "agents-busy-baseline",
    "agents-busy-discordant",
]
type = "gradient"

[[heartbeats.notes.transition.segments]]
intensity = 2.0
strategy = "linear"

[[heartbeats]]
command = """
cat ~/.claude/sessions/*.json 2>/dev/null |
  jq --slurp 'map(select(.status == "waiting")) | length / 8'
"""
crossfade_ms = 6.0
cycle_offset_secs = 0.0
cycle_secs = 15.0
name = "agents-waiting"
phrase_gap = 0.0
playback = "loop"
poll_interval_secs = 2.0
repeat_rate = 1.0
result_mode = "stdout"
tiers = []

[[heartbeats.notes]]
offset = 0.0
volume = 0.0

[heartbeats.notes.transition]
patches = [
    "agents-waiting-none",
    "agents-waiting-many",
]
type = "gradient"

[[heartbeats.notes.transition.segments]]
intensity = 3.0
strategy = "ease-out"

